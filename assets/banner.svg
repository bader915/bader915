<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Badr Albdulmajeed, electrical and electronic engineer</title>
  <desc id="d">Name banner with the disciplines cycling, and a fault recorder trace that trips and clears.</desc>
  <style>
    .bg { fill: #06090d; stroke: #24303c; stroke-width: 2; }
    .grid { stroke: #121a23; stroke-width: 1; }
    .name { font: 700 60px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #f4f6f8; letter-spacing: -1.5px; }
    .kick { font: 600 19px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #ffd23f; }
    .role { font: 500 30px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #c3ccd5; opacity: 0; animation: role 12s infinite; }
    .role:nth-of-type(2) { animation-delay: 3s; }
    .role:nth-of-type(3) { animation-delay: 6s; }
    .role:nth-of-type(4) { animation-delay: 9s; }
    .foot { font: 400 17px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #8b96a2; }
    .scope { fill: #0b1118; stroke: #24303c; stroke-width: 2; }
    .sgrid { stroke: #1a2430; stroke-width: 1; }
    .axis { stroke: #24303c; stroke-width: 2; }
    .trace { fill: none; stroke: #ffd23f; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 6s linear infinite; }
    .mark { stroke: #86a9c6; stroke-width: 1.5; stroke-dasharray: 4 6; opacity: 0; animation: mark 6s linear infinite; }
    .trip { stroke: #ffd23f; stroke-width: 2; opacity: 0; animation: trip 6s linear infinite; }
    .lbl { font: 600 14px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #8b96a2; }
    .lamp { fill: #26303a; animation: lamp 6s linear infinite; }
    .cursor { animation: cursor 6s linear infinite; }
    @keyframes role { 0% { opacity: 0; transform: translateY(14px); } 4%, 21% { opacity: 1; transform: none; } 25%, 100% { opacity: 0; transform: translateY(-10px); } }
    @keyframes draw { 0% { stroke-dashoffset: 1; opacity: 1; } 70%, 92% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes mark { 0%, 38% { opacity: 0; } 40%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes trip { 0%, 52% { opacity: 0; } 54%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes lamp { 0%, 52% { fill: #26303a; } 54%, 92% { fill: #ffd23f; } 100% { fill: #26303a; } }
    @keyframes cursor { from { transform: translateX(0); } 70% { transform: translateX(440px); } 70.01%, to { transform: translateX(440px); opacity: 0; } }
  </style>

  <rect class="bg" x="1" y="1" width="1278" height="318" rx="18"/>
  <g class="grid">
    <path d="M0 80H1280M0 160H1280M0 240H1280M160 0V320M320 0V320M480 0V320M640 0V320"/>
  </g>

  <text class="kick" x="56" y="84">Electrical and electronic engineer · Sharjah, UAE</text>
  <text class="name" x="54" y="150">Badr Albdulmajeed</text>
  <g>
    <text class="role" x="56" y="202">Power system protection</text>
    <text class="role" x="56" y="202">Siemens PLC automation</text>
    <text class="role" x="56" y="202">Machine vision for quality control</text>
    <text class="role" x="56" y="202">Embedded hardware</text>
  </g>
  <text class="foot" x="56" y="268">B.Eng (Hons) Electrical and Electronic Engineering, APU 2026 · Available to start now</text>

  <!-- a fault recorder: the waveform runs, the fault hits, the relay trips and the line goes quiet -->
  <rect class="scope" x="760" y="52" width="472" height="216" rx="12"/>
  <g class="sgrid">
    <path d="M760 106H1232M760 160H1232M760 214H1232M854 52V268M948 52V268M1042 52V268M1136 52V268"/>
  </g>
  <line class="axis" x1="776" y1="160" x2="1216" y2="160"/>
  <line class="mark" x1="1000" y1="64" x2="1000" y2="256"/>
  <line class="trip" x1="1080" y1="64" x2="1080" y2="256"/>
  <path class="trace" pathLength="1" d="M776 160 L784 151 L792 144 L800 142 L808 145 L816 152 L824 161 L832 170 L840 176 L848 178 L856 174 L864 167 L872 158 L880 149 L888 143 L896 142 L904 146 L912 154 L920 163 L928 171 L936 177 L944 178 L952 173 L960 165 L968 156 L976 148 L984 143 L992 142 L1000 147 L1008 128 L1016 112 L1024 108 L1032 118 L1040 140 L1048 170 L1056 198 L1064 212 L1072 206 L1080 160 L1216 160"/>
  <g class="cursor"><line x1="776" y1="64" x2="776" y2="256" stroke="#ffd23f" stroke-opacity=".25" stroke-width="2"/></g>
  <text class="lbl" x="1006" y="80">fault</text>
  <text class="lbl" x="1088" y="80">trip</text>
  <circle class="lamp" cx="1206" cy="244" r="8"/>
  <text class="lbl" x="1112" y="249">breaker</text>
</svg>
